name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: lint + import tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The airbyte-agent-* connectors publish wheels for >=3.13 only;
          # anything older resolves to "no matching distribution".
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check src scan.py tests test_integrations.py

      # Runs offline with no credentials. test_integrations.py is excluded by
      # testpaths — it drives live third-party services.
      - name: Tests
        run: pytest -q -m "not integration"
